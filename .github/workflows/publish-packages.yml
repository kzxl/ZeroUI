name: Publish NuGet to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, Pack & Publish NuGet Packages
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack ZeroUI.Core
        run: dotnet pack src/ZeroUI.Core/ZeroUI.Core.csproj -c Release -o nupkgs

      - name: Pack ZeroUI.WinForms
        run: dotnet pack src/ZeroUI.WinForms/ZeroUI.WinForms.csproj -c Release -o nupkgs

      - name: Pack ZeroUI.Wpf
        run: dotnet pack src/ZeroUI.Wpf/ZeroUI.Wpf.csproj -c Release -o nupkgs

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkgs/*.nupkg" --source "https://nuget.pkg.github.com/kzxl/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
